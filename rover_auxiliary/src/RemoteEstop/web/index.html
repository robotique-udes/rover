<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Stop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="panel">
    <button id="estop" onclick="triggerEStop()">E-STOP</button>
    <p id="status"></p>
    <button id="resetBtn" onclick="triggerReset()" style="display:none;">Reset</button>
  </div>

  <script>
    var SERVER_IP = "http://10.236.165.181:8080";

    function triggerEStop() {
      fetch(SERVER_IP + '/kill_teleop', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
          document.getElementById('status').textContent = data.message;
          document.getElementById('estop').classList.add('pressed');
          document.getElementById('resetBtn').style.display = 'block';
        })
        .catch(err => {
          document.getElementById('status').textContent = 'Failed: ' + err;
        });
    }

    function triggerReset() {
      fetch(SERVER_IP + '/relaunch_teleop', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
          document.getElementById('status').textContent = data.message;
          document.getElementById('estop').classList.remove('pressed');
          document.getElementById('resetBtn').style.display = 'none';
        })
        .catch(err => {
          document.getElementById('status').textContent = 'Failed: ' + err;
        });
    }
  </script>

</body>
</html>
