<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Cesium Map Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html,
    body,
    #cesiumContainer {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <script>

    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIyODRhYTgwMi1hNzk2LTRiMTgtYjc3Yy1mMTY2ZTQ0ZmU5N2UiLCJpZCI6Mjk4ODk2LCJpYXQiOjE3NDYxNDc2NjB9.GetTldL9Qxi4_Qyw8fPEGdkAH-1veIPLdltlKYF-VVw';
    // Initialize the Cesium viewer
    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: Cesium.Terrain.fromWorldTerrain({
        requestWaterMask: true,
        requestVertexNormals: true,
      }),
    });

    let entity = viewer.entities.add({
      name: "Live Position Arrow",
      position: Cesium.Cartesian3.fromDegrees(-75.0, 40.0, 20), // Add small height offset (e.g., 2m)
      billboard: {
        image: 'qrc:/arrow.png',
        width: 30,
        height: 30,
        alignedAxis: Cesium.Cartesian3.UNIT_Z,
        rotation: 0,
        color: Cesium.Color.RED,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, // Sticks to terrain
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM // Ensures arrow sits on surface
      }
    });

    // WebChannel: receives data from C++/Qt
    new QWebChannel(qt.webChannelTransport, function (channel) {
      const bridge = channel.objects.bridge;

      bridge.gpsCallback.connect(function (lat, lon, heading) {
        console.log("Received from Qt:", lat, lon, heading);

        const position = Cesium.Cartesian3.fromDegrees(lon, lat);
        entity.position = position;

        // viewer.camera.flyTo({
        //   destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1500.0),
        //   orientation: {
        //     heading: Cesium.Math.toRadians(heading),
        //     pitch: Cesium.Math.toRadians(-30.0),
        //     roll: 0.0
        //   },
        //   duration: 1.5
        // });
      });
    });
  </script>
</body>

</html>
