<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Cesium Map Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    html,
    body,
    #cesiumContainer {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIyODRhYTgwMi1hNzk2LTRiMTgtYjc3Yy1mMTY2ZTQ0ZmU5N2UiLCJpZCI6Mjk4ODk2LCJpYXQiOjE3NDYxNDc2NjB9.GetTldL9Qxi4_Qyw8fPEGdkAH-1veIPLdltlKYF-VVw';

    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: Cesium.Terrain.fromWorldTerrain({
        requestWaterMask: true,
        requestVertexNormals: true,
      }),
      sceneMode: Cesium.SceneMode.SCENE2D,
      mapMode2D: Cesium.MapMode2D.ROTATE,
    });

    let currentPosition = { latitude: 0.0, longitude: 0.0 };
    let pathEntity = null;
    let waypointEntities = [];
    let waypointCounter = 1;

    function clearAllWaypoints() {
      const entities = viewer.entities.values.slice();

      for (let i = 0; i < entities.length; i++) {
        const entity = entities[i];
        const isWaypoint = entity.id && (
          entity.id.startsWith('waypoint_') ||
          waypointEntities.includes(entity) ||
          (entity.name && entity.name.toString().includes('Waypoint'))
        );

        if (isWaypoint) {
          viewer.entities.remove(entity);
          console.log("Removed entity:", entity.id || entity.name);
        }
      }

      if (pathEntity) {
        viewer.entities.remove(pathEntity);
        pathEntity = null;
        console.log("Removed path entity");
      }

      waypointEntities = [];
      waypointCounter = 1;

      console.log("Map waypoints cleared - entities remaining:", viewer.entities.values.length);
    }

    function deleteWaypoint(waypointId) {
      const entity = viewer.entities.getById(waypointId);

      if (entity) {
        viewer.entities.remove(entity);
        console.log("Removed waypoint entity:", waypointId);

        const index = waypointEntities.findIndex(wp => wp.id === waypointId);
        if (index !== -1) {
          waypointEntities.splice(index, 1);
        }

        return true;
      } else {
        console.warn("Waypoint entity not found:", waypointId);
        return false;
      }
    }

    const entity = viewer.entities.add({
      name: "Live Position Arrow",
      position: Cesium.Cartesian3.fromDegrees(0.0, 0.0, 0),
      billboard: {
        image: 'qrc:/arrow.png',
        width: 30,
        height: 30,
        alignedAxis: Cesium.Cartesian3.UNIT_Z,
        rotation: 0,
        color: Cesium.Color.RED,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM
      }
    });

    function drawPath(startLat, startLon, endLat, endLon) {
      if (pathEntity) viewer.entities.remove(pathEntity);

      pathEntity = viewer.entities.add({
        name: "Path to Waypoint",
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray([
            startLon, startLat,
            endLon, endLat
          ]),
          width: 3,
          material: new Cesium.PolylineOutlineMaterialProperty({
            color: Cesium.Color.YELLOW,
            outlineWidth: 1,
            outlineColor: Cesium.Color.BLACK
          }),
          clampToGround: true
        }
      });

      const distance = calculateHaversineDistance(startLat, startLon, endLat, endLon);

      if (window.bridge) {
        window.bridge.pathDistanceCalculated(distance);
      }

      return distance;
    }

    function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function addWaypoint(lat, lon, name, waypointId) {
      const waypointName = name || `Waypoint ${waypointCounter++}`;
      const id = waypointId || `waypoint_${Date.now()}`;

      const waypointEntity = viewer.entities.add({
        id: id,
        name: waypointName,
        position: Cesium.Cartesian3.fromDegrees(lon, lat),
        point: {
          pixelSize: 10,
          color: Cesium.Color.BLUE,
        },
        label: {
          text: waypointName,
          font: '14pt sans-serif',
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          outlineWidth: 2,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -10),
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          showBackground: true,
          backgroundColor: new Cesium.Color(0.165, 0.165, 0.165, 0.7)
        },
        properties: {
          waypointName: waypointName,
          latitude: lat,
          longitude: lon,
          isWaypoint: true
        }
      });

      console.log("Added waypoint entity:", waypointEntity.id);
      waypointEntities.push(waypointEntity);
      return waypointEntity;
    }

    function showWaypointDialog(lat, lon) {
      Swal.fire({
        title: 'Add Waypoint',
        input: 'text',
        inputLabel: 'Waypoint Name',
        inputValue: `Waypoint ${waypointCounter}`,
        showCancelButton: true,
        confirmButtonText: 'Add',
        cancelButtonText: 'Cancel',
        inputValidator: (value) => {
          if (!value) return 'Please enter a name';
        }
      }).then((result) => {
        if (result.isConfirmed) {
          const name = result.value;
          const id = `waypoint_${Date.now()}`;
          const waypoint = addWaypoint(lat, lon, name, id);

          if (window.bridge && window.bridge.waypointCreated) {
            window.bridge.waypointCreated(name, lat, lon, id);
          }
        }
      });
    }

    viewer.screenSpaceEventHandler.setInputAction(function (click) {
      const cartesian = viewer.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
      if (cartesian) {
        const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
        const lat = Cesium.Math.toDegrees(cartographic.latitude);
        const lon = Cesium.Math.toDegrees(cartographic.longitude);
        showWaypointDialog(lat, lon);
      }
    }, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

    new QWebChannel(qt.webChannelTransport, function (channel) {
      const bridge = channel.objects.bridge;
      window.bridge = bridge;

      let viewInitialized = false;

      bridge.clearPath.connect(function () {
        console.log("clearPath signal received!");
        if (pathEntity) {
          viewer.entities.remove(pathEntity);
          pathEntity = null;
          console.log("Path cleared from map");
        }
      });

      bridge.gpsCallback.connect(function (lat, lon, heading) {
        currentPosition.latitude = lat;
        currentPosition.longitude = lon;

        const position = Cesium.Cartesian3.fromDegrees(lon, lat);
        entity.position = position;
        entity.billboard.rotation = -heading;

        if (!viewInitialized) {
          viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1000.0),
            orientation: {
              heading: 0.0,
              pitch: -90.0,
              roll: 0.0
            }
          });
          viewInitialized = true;
        }
      });

      bridge.sendGoal.connect(function (name, lat, lon) {
        const id = `waypoint_${Date.now()}`;
        addWaypoint(lat, lon, name, id);
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1000.0),
        });
      });

      bridge.calculatePath.connect(function (destLat, destLon) {
        const distance = drawPath(currentPosition.latitude, currentPosition.longitude, destLat, destLon);
        console.log(`Path distance (manual): ${distance.toFixed(2)} meters`);
      });

      bridge.clearWaypoints.connect(function () {
        console.log("clearWaypoints signal received!");
        clearAllWaypoints();
        console.log("Waypoints cleared from map");
      });

      bridge.deleteWaypoint.connect(function (waypointId) {
        console.log("deleteWaypoint signal received for:", waypointId);
        const result = deleteWaypoint(waypointId);
        console.log("Waypoint deletion result:", result);
      });

      if (bridge.jsReady) {
        bridge.jsReady();
      }
    });
  </script>
</body>

</html>
