<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Cesium Map Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    html,
    body,
    #cesiumContainer {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .cesium-viewer-bottom {
      display: none !important;
    }

    .cesium-infoBox {
      display: none !important;
    }

    #connectionError {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(134, 15, 15, 0.7);
      color: rgb(58, 58, 58);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 18px;
      display: none;
      z-index: 1000;
    }

    #controlButtons {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controlButton {
      background-color: rgba(42, 42, 42, 0.8);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background-color 0.3s ease;
    }

    .controlButton:hover {
      background-color: rgba(62, 62, 62, 0.9);
    }

    .controlButton.active {
      background-color: rgba(76, 175, 80, 0.8);
    }

    .controlButton.active:hover {
      background-color: rgba(76, 175, 80, 0.9);
    }

    .buttonIcon {
      margin-right: 5px;
      width: 16px;
      height: 16px;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <div id="controlButtons">
    <button id="topDownButton" class="controlButton" title="Lock to top-down view">
      <svg class="buttonIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
        <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z" />
        <path d="M12 16l-6-6 1.41-1.41L12 13.17l4.59-4.58L18 10z" style="opacity:0" />
      </svg>
      <span id="topDownText">Top-Down View</span>
    </button>
    <button id="trackingButton" class="controlButton" title="Toggle camera tracking">
      <svg class="buttonIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
        <path
          d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z" />
      </svg>
      <span id="trackingText">Track Position</span>
    </button>
	<button id="northFacingButton" class="controlButton" title="Toggle north facing">
		<img id="northIcon" class="buttonIcon" src="qrc:/icons/arrow.png" viewBox="0 0 24 24" fill="white">
		<span id="northFacingText"> Face North</span>
	</button>
  </div>
  <div id="connectionError">
    <h2>Not able to connect to internet</h2>
    <p>Please check your internet connection and try again.</p>
  </div>

  <script>
    let viewer;
    let currentPosition = { latitude: 45.377755, longitude: -71.924652 };
    let pathEntity = null;
    let waypointEntities = [];
    let waypointCounter = 1;
    let activeWaypoint = null;
    let pathUpdateInterval = null;
    let entity;
    let isAddingWaypoint = false;
    let cameraTracking = false;
    let isTopDownView = false;
    let lastHeading = 0;
    let lastCameraPosition = null;
	let isFacingNorth = false;
	let isAdjustingCamera = false;
	let northFacingTimeout = null;
    let recentlyCreatedWaypoints = new Set(); // Track waypoints created by visibility signal

    function checkConnectivity() {
      const connectionError = document.getElementById('connectionError');

      if (!navigator.onLine) {
        connectionError.style.display = 'block';
        return false;
      } else {
        return fetch('https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js', {
          method: 'HEAD',
          mode: 'no-cors',
          cache: 'no-store'
        })
          .then(() => {
            connectionError.style.display = 'none';
            return true;
          })
          .catch(() => {
            connectionError.style.display = 'block';
            return false;
          });
      }
    }

    function initializeMap() {
      checkConnectivity().then(isConnected => {
        if (isConnected) {
          setupCesiumMap();
        } else {
          console.error("Unable to connect to the internet");
        }
      });
    }

    function setupCesiumMap() {
      viewer = new Cesium.Viewer("cesiumContainer", {
        terrain: Cesium.Terrain.fromWorldTerrain({
          requestWaterMask: true,
          requestVertexNormals: true,
        }),
        animation: false,
        baseLayerPicker: false,
        fullscreenButton: false,
        vrButton: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        sceneModePicker: false,
        selectionIndicator: false,
        timeline: false,
        navigationHelpButton: false,
        navigationInstructionsInitiallyVisible: false,
        creditsDisplay: false,
        shouldAnimate: true,
      });

      viewer._cesiumWidget._creditContainer.style.display = "none";

      // Disable entity selection and highlighting to prevent styling conflicts
      viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK);
      viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.MOUSE_MOVE);
      
      // Disable selection and highlighting
      viewer.selectedEntity = undefined;
      viewer.trackedEntity = undefined;

      entity = viewer.entities.add({
        name: "Live Position Arrow",
        position: Cesium.Cartesian3.fromDegrees(0.0, 0.0, 0),
        model: {
          uri: 'qrc:/model/direction_arrow.glb',
          scale: 0.2,
          minimumPixelSize: 30,
          maximumScale: 60,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          rotation: 0,
          color: Cesium.Color.RED,
        },
        orientation: new Cesium.CallbackProperty(function () {
          const headingRad = Cesium.Math.toRadians(lastHeading || 0);
          return Cesium.Transforms.headingPitchRollQuaternion(
            Cesium.Cartesian3.fromDegrees(currentPosition.longitude, currentPosition.latitude),
            new Cesium.HeadingPitchRoll(headingRad, 0, 0)
          );
        }, false)
      });

      setupEventHandlers();
      setupControlButtons();
      setupBridgeConnection();
      startStylingEnforcement();
    }

    function setupControlButtons() {
      const trackingButton = document.getElementById('trackingButton');
      const topDownButton = document.getElementById('topDownButton');
	  const northFacingButton = document.getElementById('northFacingButton');

      trackingButton.addEventListener('click', function () {
        toggleCameraTracking();
      });

      topDownButton.addEventListener('click', function () {
        toggleTopDownView();
      });

	  northFacingButton.addEventListener('click', function () {
		toggleNorthFacing();
	  });
    }

	function toggleNorthFacing() 
	{
		isFacingNorth = !isFacingNorth;
		const northFacingButton = document.getElementById('northFacingButton');
		const northFacingText = document.getElementById('northFacingText');

		if (isFacingNorth)
		{
			northFacingButton.classList.add('active');
			northFacingText.textContent = 'Facing North';
			setNorthFacing();
			
        	setTimeout(() => {
            	if (isFacingNorth) 
				{
                	viewer.camera.changed.addEventListener(stillFacingNorth);
            	}
        	}, 100);
		}
		else
		{
			northFacingButton.classList.remove('active');
			northFacingText.textContent = 'Face North'
			viewer.camera.changed.removeEventListener(stillFacingNorth);

			if (northFacingTimeout) 
			{
            	clearTimeout(northFacingTimeout);
            	northFacingTimeout = null;
        	}
		}
	}

	function setNorthFacing()
	{
		if (isFacingNorth)
		{
			const desiredHeading = 0.0;
			const headingThreshold = 0.01;

			const needHeadingAdjustment = Math.abs(viewer.camera.heading - desiredHeading) > headingThreshold

			if (needHeadingAdjustment)
			{
				isAdjustingCamera = true;
				viewer.camera.setView(
				{
					orientation:
					{
						heading: desiredHeading,
						pitch: viewer.camera.pitch,
						roll: 0.0
					}
				});
				isAdjustingCamera = false;
			}
		}	
	}

	function stillFacingNorth() 
	{
		if (!isFacingNorth || isAdjustingCamera)
    {
      return;
    } 

		if (northFacingTimeout)
		{
			clearTimeout(northFacingTimeout);
		}

		northFacingTimeout = setTimeout(() => {
			const currentHeading = viewer.camera.heading;
			const desiredHeading = 0.0;
			const headingThreshold = 0.05;
			const notOnNorth = Math.abs(currentHeading - desiredHeading) > headingThreshold;

			if (notOnNorth) 
			{
				toggleNorthFacing();
			}
			northFacingTimeout = null;
		}, 200);
	}

	function toggleTopDownView() {
      isTopDownView = !isTopDownView;
      const topDownButton = document.getElementById('topDownButton');
      const topDownText = document.getElementById('topDownText');

      if (isTopDownView) {
        if (!cameraTracking) {
          lastCameraPosition = {
            position: viewer.camera.position.clone(),
            heading: viewer.camera.heading,
            pitch: viewer.camera.pitch,
            roll: viewer.camera.roll
          };
        }

        topDownButton.classList.add('active');
        topDownText.textContent = 'Exit Top-Down';

        try {
          setTopDownView();
		  
		  if(!isFacingNorth)
		  {
			toggleNorthFacing();
		  }

          if (viewer && viewer.scene && viewer.scene.screenSpaceCameraController) {
            viewer.scene.screenSpaceCameraController.enableTilt = false;
          }

          viewer.camera.changed.addEventListener(maintainTopDownPerspective);
        } catch (error) {
          console.error("Error enabling top-down view:", error);
          isTopDownView = false;
          topDownButton.classList.remove('active');
          topDownText.textContent = 'Top-Down View';
        }
      } else {
        topDownButton.classList.remove('active');
        topDownText.textContent = 'Top-Down View';

		if (isFacingNorth) 
		{
            toggleNorthFacing();
        }

        try {
          if (viewer && viewer.scene && viewer.scene.screenSpaceCameraController) {
            viewer.scene.screenSpaceCameraController.enableTilt = true;
          }

          viewer.camera.changed.removeEventListener(maintainTopDownPerspective);

          if (lastCameraPosition && !cameraTracking) {
            viewer.camera.setView({
              destination: lastCameraPosition.position,
              orientation: {
                heading: lastCameraPosition.heading,
                pitch: lastCameraPosition.pitch,
                roll: lastCameraPosition.roll
              }
            });
          }
        } catch (error) {
          console.error("Error disabling top-down view:", error);
        }
      }

      try {
        if (window.bridge && window.bridge.topDownViewChanged) {
          window.bridge.topDownViewChanged(isTopDownView); // #TODO: Not implemented in C++
        }
      } catch (error) {
        console.error("Error notifying bridge about top-down state:", error);
      }
    }

    function setTopDownView() {
      if (!isTopDownView || !viewer || !viewer.camera) return;

      try {
        let cameraHeight = 1000.0;
        try {
          if (viewer.camera.positionCartographic) {
            cameraHeight = Math.max(viewer.camera.positionCartographic.height, 1000.0);
          }
        } catch (e) {
          console.warn("Could not get camera height, using default:", e);
        }

        const targetLongitude = cameraTracking ? currentPosition.longitude : viewer.camera.positionCartographic.longitude * 180.0 / Math.PI;
        const targetLatitude = cameraTracking ? currentPosition.latitude : viewer.camera.positionCartographic.latitude * 180.0 / Math.PI;

        isAdjustingCamera = true;
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(
            targetLongitude,
            targetLatitude,
            cameraHeight
          ),
          orientation: {
            heading: 0.0,
            pitch: -Math.PI / 2,
            roll: 0.0
          }
        });
        isAdjustingCamera = false;
      } catch (error) {
        console.error("Failed to update camera to top-down view:", error);
        try {
          isAdjustingCamera = true;
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(
              currentPosition.longitude,
              currentPosition.latitude,
              1000.0
            ),
            orientation: {
              heading: viewer.camera.heading,
              pitch: -Math.PI / 2,
              roll: 0.0
            }
          });
          isAdjustingCamera = false;
        } catch (flyError) {
          console.error("Even fallback camera update failed:", flyError);
          isTopDownView = false;
          document.getElementById('topDownButton').classList.remove('active');
          document.getElementById('topDownText').textContent = 'Top-Down View';
        }
      }
    }

    function maintainTopDownPerspective() {
      if (!isTopDownView || isAdjustingCamera) return;

      const currentPitch = viewer.camera.pitch;
      const desiredPitch = -Math.PI / 2;
      const pitchThreshold = 0.01;

	  const needPitchAdjustment = Math.abs(currentPitch - desiredPitch) > pitchThreshold;

      if (needPitchAdjustment) {
        isAdjustingCamera = true;
        viewer.camera.setView({
          orientation: {
            heading: viewer.camera.heading,
            pitch: desiredPitch,
            roll: 0.0
          }
        });
        isAdjustingCamera = false;
      }
    }

    function toggleCameraTracking() {
      cameraTracking = !cameraTracking;
      const trackingButton = document.getElementById('trackingButton');
      const trackingText = document.getElementById('trackingText');

      if (cameraTracking) {
        trackingButton.classList.add('active');
        trackingText.textContent = 'Tracking On';

        try {
          updateCameraPosition();

        } catch (error) {
          console.error("Error enabling tracking:", error);
          cameraTracking = false;
          trackingButton.classList.remove('active');
          trackingText.textContent = 'Track Position';
        }
      } else {
        trackingButton.classList.remove('active');
        trackingText.textContent = 'Track Position';

      }

      try {
        if (window.bridge && window.bridge.cameraTrackingChanged) {
          window.bridge.cameraTrackingChanged(cameraTracking); // #TODO: Not implemented in C++
        }
      } catch (error) {
        console.error("Error notifying bridge about tracking state:", error);
      }
    }

    function updateCameraPosition() {
      if (!cameraTracking || !viewer || !viewer.camera) return;

      try {
        let cameraHeight = 1000.0;
        try {
          if (viewer.camera.positionCartographic) {
            cameraHeight = viewer.camera.positionCartographic.height;
          }
        } catch (e) {
          console.warn("Could not get camera height, using default:", e);
        }

        const orientation = {
								heading: viewer.camera.heading,
								pitch: viewer.camera.pitch,
								roll: 0.0 
							};

        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(
            currentPosition.longitude,
            currentPosition.latitude,
            cameraHeight
          ),
          orientation: orientation
        });
      } catch (error) {
        console.error("Failed to update camera position:", error);
        try {
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(
              currentPosition.longitude,
              currentPosition.latitude,
              1000.0
            )
          });
        } catch (flyError) {
          console.error("Even fallback camera update failed:", flyError);
          cameraTracking = false;
          document.getElementById('trackingButton').classList.remove('active');
          document.getElementById('trackingText').textContent = 'Track Position';
        }
      }
    }

    function setupEventHandlers() {
      viewer.screenSpaceEventHandler.setInputAction(function (click) {
        if (cameraTracking) {
          toggleCameraTracking();
        }

        try {
          let cartesian;
          const scene = viewer.scene;

          if (scene.terrainProvider.ready) {
            cartesian = scene.pickPosition(click.position);

            if (cartesian) {
              const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
              if (cartographic.height > 10000 || cartographic.height < -1000) {
                cartesian = undefined;
              }
            }
          }

          if (!Cesium.defined(cartesian)) {
            const drillPickResult = scene.drillPick(click.position);
            if (drillPickResult.length > 0) {
              for (let i = 0; i < drillPickResult.length; i++) {
                if (Cesium.defined(drillPickResult[i].primitive) &&
                  Cesium.defined(drillPickResult[i].primitive.position)) {
                  cartesian = drillPickResult[i].primitive.position;
                  break;
                }
              }
            }
          }

          if (!Cesium.defined(cartesian)) {
            const ray = viewer.camera.getPickRay(click.position);
            if (Cesium.defined(ray)) {
              cartesian = viewer.scene.globe.pick(ray, viewer.scene);
            }
          }

          if (!Cesium.defined(cartesian)) {
            cartesian = viewer.camera.pickEllipsoid(
              click.position,
              viewer.scene.globe.ellipsoid
            );
          }

          if (Cesium.defined(cartesian)) {
            const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
            const lat = Cesium.Math.toDegrees(cartographic.latitude);
            const lon = Cesium.Math.toDegrees(cartographic.longitude);

            setTimeout(() => {
              showWaypointDialog(lat, lon);
            }, 50);
          }
        } catch (error) {
        }
      }, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

      viewer.screenSpaceEventHandler.setInputAction(function () {
        if (cameraTracking) {
          toggleCameraTracking();
        }
      }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

      viewer.screenSpaceEventHandler.setInputAction(function () {
        if (cameraTracking) {
          toggleCameraTracking();
        }
      }, Cesium.ScreenSpaceEventType.WHEEL);
    }

    function setupBridgeConnection() {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        const bridge = channel.objects.bridge;
        window.bridge = bridge;

        let viewInitialized = false;

        bridge.clearPath.connect(function () {
          stopDynamicPathUpdates();
        });

        bridge.gpsCallback.connect(function (lat, lon, headingDeg) {
          currentPosition.latitude = lat;
          currentPosition.longitude = lon;
          lastHeading = headingDeg;

          entity.position = Cesium.Cartesian3.fromDegrees(lon, lat);

          if (!viewInitialized) {
            try {
              viewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1000.0),
                orientation: {
                  heading: 0.0,
                  pitch: -90.0,
                  roll: 0.0
                }
              });
              viewInitialized = true;
            } catch (error) {
              console.error("Error initializing view:", error);
            }
          }

          if (cameraTracking) {
            try {
              updateCameraPosition();
            } catch (error) {
              console.error("Error updating camera position:", error);
              if (cameraTracking) {
                toggleCameraTracking();
              }
            }
          }

          if (isTopDownView) {
            try {
              setTopDownView();
            } catch (error) {
              console.error("Error updating top-down view:", error);
            }
          }
        });

        bridge.waypointIsVisible.connect(function (lat, lon, name, waypointId, visibility) {
          // Initialize master waypoint data storage if it doesn't exist
          if (!window.masterWaypointData) {
            window.masterWaypointData = {};
          }
          
          // If waypoint doesn't exist in master data, create it
          if (!window.masterWaypointData[waypointId]) {
            window.masterWaypointData[waypointId] = {
              id: waypointId,
              name: name,
              latitude: lat,
              longitude: lon,
              visible: visibility
            };
            
            // Track that this waypoint was created by visibility signal
            recentlyCreatedWaypoints.add(name);
            
            // Clear the flag after a short delay to allow sendGoal to process
            setTimeout(() => {
              recentlyCreatedWaypoints.delete(name);
            }, 1000);
          } else {
            // Update existing waypoint visibility
            window.masterWaypointData[waypointId].visible = visibility;
          }
          
          // Force the visibility update
          waypointVisibility(visibility, waypointId);
        });

        bridge.sendGoal.connect(function (name, lat, lon) {
          if (isAddingWaypoint) {
            return;
          }

          // Check if this is a duplicate of an existing, visible waypoint
          // BUT skip the check if this waypoint was just created by the visibility signal
          if (!recentlyCreatedWaypoints.has(name) && visibleWaypointNameExists(name)) {
            Swal.fire({
              title: 'Duplicate Waypoint',
              text: `A waypoint named "${name}" already exists. Please use a different name.`,
              icon: 'warning',
              confirmButtonText: 'OK'
            });
            return;
          }
          
          // Clear from recently created set since we're about to create it properly
          recentlyCreatedWaypoints.delete(name);

          if (!isLocationAvailable(lat, lon, name)) {
            Swal.fire({
              title: 'Duplicate Location',
              text: `A waypoint already exists at this location. Please choose a different location.`,
              icon: 'warning',
              confirmButtonText: 'OK'
            });
            return;
          }

          isAddingWaypoint = true;
          const id = `waypoint_${Date.now()}`;

          addWaypoint(lat, lon, name, id, true);

          const wasTracking = cameraTracking;
          const wasTopDown = isTopDownView;

          if (cameraTracking) {
            toggleCameraTracking();
          }

          if (isTopDownView) {
            toggleTopDownView();
          }

          // Ensure the camera flies to the waypoint location
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1000.0),
            complete: function () {
              viewer.scene.requestRender();
              isAddingWaypoint = false;

              if (wasTracking) {
                toggleCameraTracking();
              }

              if (wasTopDown) {
                toggleTopDownView();
              }
            }
          });

          if (window.bridge && window.bridge.waypointCreated) {
            window.bridge.waypointCreated(name, lat, lon, id);
          }
        });

        bridge.calculatePath.connect(function (destLat, destLon, waypointId) {
          startDynamicPathUpdates(destLat, destLon, waypointId);
        });

        bridge.clearWaypoints.connect(function () {
          stopDynamicPathUpdates();
          clearAllWaypoints();
        });

        bridge.deleteWaypoint.connect(function (waypointId) {
          if (activeWaypoint && activeWaypoint.id === waypointId) {
            stopDynamicPathUpdates();
          }
          deleteWaypoint(waypointId);
        });

        if (bridge.setCameraTracking) {
          bridge.setCameraTracking.connect(function (enabled) {
            if (cameraTracking !== enabled) {
              toggleCameraTracking();
            }
          });
        }

        if (bridge.setTopDownView) {
          bridge.setTopDownView.connect(function (enabled) {
            if (isTopDownView !== enabled) {
              toggleTopDownView();
            }
          });
        }

        if (bridge.jsReady) {
          bridge.jsReady();
        }
      });
    }

    function clearAllWaypoints() {
      waypointEntities.forEach(waypoint => {
        viewer.entities.remove(waypoint);
      });
      waypointEntities = [];
      waypointCounter = 1;

      // Clear master waypoint data as well
      if (window.masterWaypointData) {
        window.masterWaypointData = {};
      }
      
      // Clear recently created waypoints
      recentlyCreatedWaypoints.clear();

      if (pathEntity) {
        viewer.entities.remove(pathEntity);
        pathEntity = null;
      }
    }

    function deleteWaypoint(waypointId) {
      const entity = viewer.entities.getById(waypointId);
      if (entity) {
        viewer.entities.remove(entity);
        waypointEntities = waypointEntities.filter(wp => wp.id !== waypointId);
        
        // Remove from master data as well
        if (window.masterWaypointData && window.masterWaypointData[waypointId]) {
          delete window.masterWaypointData[waypointId];
        }
        
        return true;
      }
      return false;
    }

    function drawPath(startLat, startLon, endLat, endLon) {
      if (pathEntity) {
        viewer.entities.remove(pathEntity);
      }

      pathEntity = viewer.entities.add({
        name: "Path to Waypoint",
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray([startLon, startLat, endLon, endLat]),
          width: 3,
          material: new Cesium.PolylineOutlineMaterialProperty({
            color: Cesium.Color.YELLOW,
            outlineWidth: 1,
            outlineColor: Cesium.Color.BLACK
          }),
          clampToGround: true
        }
      });

      const distance = calculateHaversineDistance(startLat, startLon, endLat, endLon);
      if (window.bridge) {
        window.bridge.pathDistanceCalculated(distance);
      }
      return distance;
    }

    function startDynamicPathUpdates(destLat, destLon, waypointId) {
      activeWaypoint = {
        latitude: destLat,
        longitude: destLon,
        id: waypointId
      };

      clearInterval(pathUpdateInterval);
      pathUpdateInterval = setInterval(() => {
        if (currentPosition && activeWaypoint) {
          drawPath(
            currentPosition.latitude,
            currentPosition.longitude,
            activeWaypoint.latitude,
            activeWaypoint.longitude
          );
        }
      }, 1000);

      drawPath(
        currentPosition.latitude,
        currentPosition.longitude,
        destLat,
        destLon
      );
    }

    function stopDynamicPathUpdates() {
      clearInterval(pathUpdateInterval);
      pathUpdateInterval = null;
      activeWaypoint = null;

      if (pathEntity) {
        viewer.entities.remove(pathEntity);
        pathEntity = null;
      }
    }

    function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function waypointNameExists(name) {
      // DO NOT increment counter here - just check the name as-is
      const waypointName = name;
      
      // Check in visible entities
      const existingNameWaypoint = waypointEntities.find(wp => wp.name === waypointName);
      if (existingNameWaypoint) {
        return true; // Name already exists
      }
      
      // Check in master data
      if (window.masterWaypointData) {
        for (const wpId in window.masterWaypointData) {
          if (window.masterWaypointData[wpId].name === waypointName) {
            return true; // Name already exists
          }
        }
      }
      
      return false; // Name is available
    }

    function visibleWaypointNameExists(name) {
      // DO NOT increment counter here - just check the name as-is
      const waypointName = name;
      
      // Initialize master waypoint data storage if it doesn't exist
      if (!window.masterWaypointData) {
        window.masterWaypointData = {};
      }
      
      // Check master data for visible waypoints with the same name
      for (const waypointId in window.masterWaypointData) {
        const waypointData = window.masterWaypointData[waypointId];
        if (waypointData.name === waypointName && waypointData.visible === true) {
          return true; // Name already exists among visible waypoints
        }
      }
      
      return false; // Name is available
    }

    function isLocationAvailable(lat, lon, name) {
      // Initialize master waypoint data storage if it doesn't exist
      if (!window.masterWaypointData) {
        window.masterWaypointData = {};
      }
      
      // Check master data for visible waypoints at similar locations
      for (const waypointId in window.masterWaypointData) {
        const waypointData = window.masterWaypointData[waypointId];
        
        // Skip if waypoint is not visible or has the same name
        if (!waypointData.visible || (name && waypointData.name === name)) {
          continue;
        }
        
        try {
          const wpLat = waypointData.latitude;
          const wpLon = waypointData.longitude;

          const latDiff = Math.abs(wpLat - lat) * 111000;
          const lonDiff = Math.abs(wpLon - lon) * 111000 * Math.cos(lat * Math.PI / 180);
          const distance = Math.sqrt(latDiff * latDiff + lonDiff * lonDiff);
          const distanceCm = distance * 100;            if (distanceCm < 20) {
              return false;
            }

        } catch (error) {
          console.warn(`Error checking location for waypoint ${waypointId}:`, error);
        }
      }
      
      return true;
    }


    function addWaypoint(lat, lon, name, waypointId, visibility) {
      const waypointName = name || `Waypoint ${waypointCounter++}`;
      const id = waypointId || `waypoint_${Date.now()}`;

      // Ensure visibility is properly defined (default to true if undefined)
      const isVisible = visibility !== undefined ? visibility : true;

      // Initialize master waypoint data storage if it doesn't exist
      if (!window.masterWaypointData) {
        window.masterWaypointData = {};
      }

      // Check if waypoint already exists
      const existingEntity = viewer.entities.getById(id);
      if (existingEntity) {
        return existingEntity;
      }

      // Store waypoint data in master data structure
      window.masterWaypointData[id] = {
        id: id,
        name: waypointName,
        latitude: lat,
        longitude: lon,
        visible: isVisible
      };

      // Only create the entity if it's visible
      if (isVisible) {
        const waypointEntity = viewer.entities.add({
          id: id,
          name: waypointName,
          position: Cesium.Cartesian3.fromDegrees(lon, lat),
          show: true,
          point: {
            pixelSize: new Cesium.ConstantProperty(10),
            color: new Cesium.ConstantProperty(Cesium.Color.BLUE),
            outlineColor: new Cesium.ConstantProperty(Cesium.Color.WHITE),
            outlineWidth: new Cesium.ConstantProperty(2),
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
            show: new Cesium.ConstantProperty(true)
          },
          label: {
            text: waypointName,
            font: '14pt sans-serif',
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            outlineWidth: 2,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -10),
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            showBackground: true,
            backgroundColor: new Cesium.Color(0.165, 0.165, 0.165, 0.7),
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
            show: new Cesium.ConstantProperty(true)
          }
        });

        // Force correct styling immediately after creation
        setTimeout(() => {
          if (waypointEntity.point) {
            waypointEntity.point.color = Cesium.Color.BLUE;
            waypointEntity.point.outlineColor = Cesium.Color.WHITE;
            waypointEntity.point.outlineWidth = 2;
            waypointEntity.point.pixelSize = 10;
            waypointEntity.point.show = true;
          }
          viewer.scene.requestRender();
        }, 50);

        waypointEntities.push(waypointEntity);
        
        // Start continuous styling enforcement
        startStylingEnforcement();
        
        return waypointEntity;
      } else {
        // Waypoint is hidden, just store in master data
        return null;
      }
    }

    // SIMPLIFIED WAYPOINT VISIBILITY FUNCTION
    // ROBUST WAYPOINT VISIBILITY FUNCTION - RECREATE ALL WAYPOINTS
    function waypointVisibility(visibility, waypointId) {
      // Initialize master waypoint data storage if it doesn't exist
      if (!window.masterWaypointData) {
        window.masterWaypointData = {};
      }
      
      // Check if we have data for this waypoint
      if (!window.masterWaypointData[waypointId]) {
        console.warn(`Waypoint ${waypointId} not found in master data`);
        return;
      }
      
      // Update visibility in master data
      window.masterWaypointData[waypointId].visible = visibility;
      
      // ROBUST APPROACH: Clear and recreate all waypoints
      // This ensures there are no hidden waypoints still in the scene
      
      // First, preserve non-waypoint entities
      const nonWaypointEntities = [];
      const allEntities = viewer.entities.values.slice();
      
      for (let i = 0; i < allEntities.length; i++) {
        const entity = allEntities[i];
        if (!entity.id.startsWith('waypoint_')) {
          nonWaypointEntities.push(entity);
        }
      }
      
      // Clear all waypoints from the scene
      const waypointIds = Object.keys(window.masterWaypointData);
      for (let i = 0; i < waypointIds.length; i++) {
        const wpId = waypointIds[i];
        const existingEntity = viewer.entities.getById(wpId);
        if (existingEntity) {
          viewer.entities.remove(existingEntity);
        }
      }
      
      // Clear the waypoint entities array
      waypointEntities = [];
      
      // Now recreate ONLY visible waypoints
      for (const wpId in window.masterWaypointData) {
        const data = window.masterWaypointData[wpId];
        
        if (data.visible === true) {
          try {
            const waypointEntity = viewer.entities.add({
              id: data.id,
              name: data.name,
              position: Cesium.Cartesian3.fromDegrees(data.longitude, data.latitude),
              show: true,
              point: {
                pixelSize: new Cesium.ConstantProperty(10),
                color: new Cesium.ConstantProperty(Cesium.Color.BLUE),
                outlineColor: new Cesium.ConstantProperty(Cesium.Color.WHITE),
                outlineWidth: new Cesium.ConstantProperty(2),
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                show: new Cesium.ConstantProperty(true)
              },
              label: {
                text: data.name,
                font: '14pt sans-serif',
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                outlineWidth: 2,
                verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                pixelOffset: new Cesium.Cartesian2(0, -10),
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                showBackground: true,
                backgroundColor: new Cesium.Color(0.165, 0.165, 0.165, 0.7),
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                show: new Cesium.ConstantProperty(true)
              }
            });
            
            waypointEntities.push(waypointEntity);
            
            // Force correct styling immediately
            setTimeout(() => {
              if (waypointEntity.point) {
                waypointEntity.point.color = new Cesium.ConstantProperty(Cesium.Color.BLUE);
                waypointEntity.point.outlineColor = new Cesium.ConstantProperty(Cesium.Color.WHITE);
                waypointEntity.point.outlineWidth = new Cesium.ConstantProperty(2);
                waypointEntity.point.pixelSize = new Cesium.ConstantProperty(10);
                waypointEntity.point.show = new Cesium.ConstantProperty(true);
              }
            }, 50);
            
          } catch (error) {
            console.error(`Error recreating waypoint ${data.id}:`, error);
          }
        }
      }
      
      // Force scene update
      viewer.scene.requestRender();
    }



    function showWaypointDialog(lat, lon) {
      Swal.fire({
        title: 'Add Waypoint',
        input: 'text',
        inputLabel: 'Waypoint Name',
        inputValue: `Waypoint ${waypointCounter}`,
        showCancelButton: true,
        confirmButtonText: 'Add',
        cancelButtonText: 'Cancel',
        inputValidator: (value) => {
          if (!value) return 'Please enter a name';

          if (visibleWaypointNameExists(value)) {
            return 'A waypoint with this name already exists. Please choose a different name.';
          }
        }
      }).then((result) => {
        if (result.isConfirmed) {
          const name = result.value;
          const id = `waypoint_${Date.now()}`;

          if (visibleWaypointNameExists(name)) {
            Swal.fire({
              title: 'Error',
              text: 'A waypoint with this name already exists. Please try again with a different name.',
              icon: 'error'
            });
            return;
          }

          const waypoint = addWaypoint(lat, lon, name, id, true);

          if (waypoint && window.bridge && window.bridge.waypointCreated) {
            window.bridge.waypointCreated(name, lat, lon, id);
          }
        }
      });
    }

    // Continuous styling enforcement system
    let stylingInterval = null;
    
    function startStylingEnforcement() {
      if (stylingInterval) {
        clearInterval(stylingInterval);
      }
      
      // Check and enforce styling every 500ms
      stylingInterval = setInterval(() => {
        enforceWaypointStyling();
      }, 500);
    }
    
    function stopStylingEnforcement() {
      if (stylingInterval) {
        clearInterval(stylingInterval);
        stylingInterval = null;
      }
    }
    
    function enforceWaypointStyling() {
      if (!waypointEntities || waypointEntities.length === 0) {
        return;
      }
      
      waypointEntities.forEach(waypoint => {
        if (waypoint && waypoint.point) {
          try {
            // Get current colors
            const currentColor = waypoint.point.color instanceof Cesium.ConstantProperty 
              ? waypoint.point.color.getValue() 
              : waypoint.point.color;
            const currentOutlineColor = waypoint.point.outlineColor instanceof Cesium.ConstantProperty 
              ? waypoint.point.outlineColor.getValue() 
              : waypoint.point.outlineColor;
            
            const expectedBlue = Cesium.Color.BLUE;
            const expectedWhite = Cesium.Color.WHITE;
            
            // Check if colors need fixing
            const needsColorFix = !currentColor || !Cesium.Color.equals(currentColor, expectedBlue);
            const needsOutlineFix = !currentOutlineColor || !Cesium.Color.equals(currentOutlineColor, expectedWhite);
            
            if (needsColorFix || needsOutlineFix) {
              // Force correct styling - use ConstantProperty to prevent changes
              waypoint.point.color = new Cesium.ConstantProperty(Cesium.Color.BLUE);
              waypoint.point.outlineColor = new Cesium.ConstantProperty(Cesium.Color.WHITE);
              waypoint.point.outlineWidth = new Cesium.ConstantProperty(2);
              waypoint.point.pixelSize = new Cesium.ConstantProperty(10);
              waypoint.point.show = new Cesium.ConstantProperty(true);
              
              // Force scene update
              viewer.scene.requestRender();
            }
          } catch (error) {
            console.warn(`Error enforcing styling for waypoint ${waypoint.id}:`, error);
          }
        }
      });
    }

    // Debug function for testing waypoint visibility
    window.testWaypointVisibility = function(waypointId, visibility) {
      console.log(`Testing waypoint visibility: ${waypointId} -> ${visibility}`);
      if (window.masterWaypointData && window.masterWaypointData[waypointId]) {
        waypointVisibility(visibility, waypointId);
      } else {
        console.error(`Waypoint ${waypointId} not found in master data`);
        console.log('Available waypoints:', Object.keys(window.masterWaypointData || {}));
      }
    };
    
    // Debug function to show master waypoint data
    window.showMasterData = function() {
      console.log('Master waypoint data:', window.masterWaypointData);
      console.log('Waypoint entities:', waypointEntities.map(wp => ({ id: wp.id, name: wp.name, show: wp.show })));
    };

    window.addEventListener('load', initializeMap);
    window.addEventListener('online', initializeMap);
    window.addEventListener('offline', function () {
      document.getElementById('connectionError').style.display = 'block';
    });

  </script>
