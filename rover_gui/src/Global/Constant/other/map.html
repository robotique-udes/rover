<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Cesium Map Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="qrc:/other/JS/constant.js"></script>
  
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link rel="stylesheet" href="qrc:/other/CSS/map.css">
</head>

<body>
  <div id="cesiumContainer"></div>
  <div id="controlButtons">
    <button id="topDownButton" class="controlButton" title="Lock to top-down view">
      <svg class="buttonIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
        <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z" />
        <path d="M12 16l-6-6 1.41-1.41L12 13.17l4.59-4.58L18 10z" style="opacity:0" />
      </svg>
      <span id="topDownText">Top-Down View</span>
    </button>
    <button id="trackingButton" class="controlButton" title="Toggle camera tracking">
      <svg class="buttonIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
        <path
        d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z" />
      </svg>
      <span id="trackingText">Track Position</span>
    </button>
    <button id="northFacingButton" class="controlButton" title="Toggle north facing">
      <img id="northIcon" class="buttonIcon" src="qrc:/icons/arrow.png" viewBox="0 0 24 24" fill="white">
      <span id="northFacingText"> Face North</span>
    </button>
  </div>
  <div id="connectionError">
    <h2>Not able to connect to internet</h2>
    <p>Please check your internet connection and try again.</p>
  </div>
  
  <script src="qrc:/other/JS/waypoints.js"></script>
  <script src="qrc:/other/JS/camera.js"></script>
  <script src="qrc:/other/JS/utils.js"></script>
  <script src="qrc:/other/JS/bridge.js"></script> 
  <script type="module" src="qrc:/other/JS/map.js"></script>
</body>

</html>
