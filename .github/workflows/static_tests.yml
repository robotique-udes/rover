name: ROS 2 Jazzy Static Analysis

on:
  pull_request:
    branches:
      - release/**
  push:
    branches:
      - release/**
  merge_group:
    types: [checks_requested]

jobs:
  clang-tidy:
    name: 'clang-tidy on ROS2 Jazzy (Ubuntu 24.04)'
    runs-on: ubuntu-24.04

    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup environment
        shell: bash
        run: |
          echo -e "\e[0;34m=== Downloading and installing packages dependencies ... ===\e[0m"
          chmod +x scripts/provision.sh
          scripts/provision.sh
          echo -e "\e[0;32m[OK] Dependencies installed successfully\e[0m"

      - name: Install clang-tidy
        shell: bash
        run: |
          apt-get update
          apt-get install -y clang-tidy ros-jazzy-ament-clang-tidy

      - name: Build (exports compile_commands.json)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export CPR_USE_SYSTEM_CURL=ON
          colcon build \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          for pkg in $(colcon list --names-only); do
            if [ -f build/$pkg/compile_commands.json ]; then
              ament_clang_tidy --config .clang-tidy build/$pkg
            fi
          done