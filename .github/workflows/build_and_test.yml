name: Build & Static tests

on:
  pull_request:
    branches:
      - release/**
  push:
    branches:
      - release/**
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jazzy-build:
    name: 'Build and static analysis on ROS2 Jazzy (Ubuntu 24.04)'
    runs-on: ubuntu-24.04

    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup environment
        shell: bash
        run: |
          echo -e "\e[0;34m=== Downloading and installing packages dependencies ... ===\e[0m"
          chmod +x scripts/provision.sh
          scripts/provision.sh
          echo -e "\e[0;32m[OK] Dependencies installed successfully\e[0m"

      - name: Install clang-tidy
        shell: bash
        run: |
          apt-get update
          apt-get install -y clang-tidy ros-jazzy-ament-clang-tidy

      - name: Determine packages to analyse
        id: packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo -e "\e[0;34m=== Determining changed packages ===\e[0m"

            # Fetch the PR base branch ref explicitly so Git can resolve it
            git config --global --add safe.directory /__w/rover/rover
            git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

            packages=$(printf '%s\n' "$changed_files" |
              grep '^rover_' |
              cut -d/ -f1 |
              sort -u |
              grep -Ev '^rover_msgs$' |
              tr '\n' ' ')

            echo "Changed packages: $packages"

          else
            echo -e "\e[0;34m=== Analysing all packages ===\e[0m"

            packages=$(colcon list |
              awk -F'\t' \
                '$2 !~ /^(\.\/)?deps\// && $1 != "rover_msgs" {print $1}' |
              tr '\n' ' ')

            echo "Packages: $packages"
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Build all rover packages
        shell: bash
        run: |
          echo -e "\e[0;34m=== Sourcing for build ... ===\e[0m"
          source /opt/ros/jazzy/setup.bash
          echo -e "\e[0;32m[OK]\e[0m"

          export CPR_USE_SYSTEM_CURL=ON
          export CXXFLAGS="-Werror"

          echo -e "\e[0;34m=== Building all ROS2 Packages ... ===\e[0m"

          if colcon build \
              --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON; then
            echo -e "\e[0;32m=== [SUCCESS] ===\e[0m"
          else
            echo -e "\e[0;31m[FAILED] Building step triggered warnings or errors\e[0m"
            exit 1
          fi

      - name: Run clang-tidy
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash

          packages="${{ steps.packages.outputs.packages }}"

          if [[ -z "$packages" ]]; then
            echo -e "\e[0;33mNo packages require clang-tidy analysis. Skipping.\e[0m"
            exit 0
          fi

          echo "Running clang-tidy on: $packages"

          fail=0

          for pkg in $packages; do
            if [ -f "build/$pkg/compile_commands.json" ]; then
              if ! ament_clang_tidy --config .clang-tidy "build/$pkg"; then
                echo "clang-tidy failed for $pkg"
                fail=1
              fi
            else
              echo "No compile_commands.json found for $pkg, skipping"
            fi
          done

          exit $fail